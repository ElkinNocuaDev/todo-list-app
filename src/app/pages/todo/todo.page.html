<ion-header translucent="true">
  <ion-toolbar>
    <ion-title class="title-main">To-Do</ion-title>
  </ion-toolbar>

  <ion-toolbar>
    <div class="subtitle">
      Organiza tus tareas por categorías
    </div>
  </ion-toolbar>

  <!-- 🔥 Categorías -->
  <ion-toolbar *ngIf="showCategories">
    <ion-segment
      scrollable="true"
      (ionChange)="onCategoryChange($event.detail.value)">

      <ion-segment-button value="">
        <ion-label>Todas</ion-label>
      </ion-segment-button>

      <ion-segment-button
        *ngFor="let cat of (categories$ | async)"
        [value]="cat.id">
        <ion-label>{{ cat.name }}</ion-label>
      </ion-segment-button>

    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen class="ion-padding">

  <!-- 🔥 INPUT PRO -->
  <div class="input-card">
    <ion-input #input placeholder="¿Qué necesitas hacer?"></ion-input>

    <ion-button
      fill="solid"
      shape="round"
      (click)="addTask(input.value); input.value=''">
      Agregar tarea
    </ion-button>
  </div>

  <!-- 🔥 EMPTY STATE PRO -->
  <div *ngIf="(filteredTasks$ | async)?.length === 0" class="empty-state">
    <h3>Todo listo 🚀</h3>
    <p>No tienes tareas pendientes</p>
  </div>

  <!-- 🔥 LISTA PRO -->
  <ion-list class="task-list">

    <ion-item-sliding
      *ngFor="let task of (filteredTasks$ | async); trackBy: trackById">

      <ion-item class="task-item">

        <ion-checkbox
          slot="start"
          [checked]="task.completed"
          (ionChange)="toggle(task.id)">
        </ion-checkbox>

        <ion-label>
          <h2 [class.completed]="task.completed">
            {{ task.title }}
          </h2>
        </ion-label>

        <ion-button
            fill="clear"
            slot="end"
            (click)="delete(task.id)"
            style="color: #eb445a;">

            <ion-icon name="trash-outline"></ion-icon>
            Borrar
        </ion-button>

      </ion-item>

    </ion-item-sliding>

  </ion-list>

  <!-- 🔥 FAB -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="openCategoryModal()">
      +
    </ion-fab-button>
  </ion-fab>

  <!-- 🔥 MODAL -->
  <ion-modal [isOpen]="isCategoryModalOpen">
    <ng-template>

      <ion-header>
        <ion-toolbar>
          <ion-title>Nueva Categoría</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="closeCategoryModal()">Cerrar</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>

      <ion-content class="ion-padding">

        <ion-input
          placeholder="Nombre de la categoría"
          [(ngModel)]="newCategoryName">
        </ion-input>

        <ion-button expand="block" (click)="saveCategory()">
          Guardar
        </ion-button>

      </ion-content>

    </ng-template>
  </ion-modal>

</ion-content>
